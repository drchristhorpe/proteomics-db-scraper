[project]
name = "proteomics-db-scraper"
version = "0.1.0"
description = "Scraper pipeline for https://pci-db.org/psms/"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[project.scripts]
pci-step-1 = "steps.step_1_diseases:main"
pci-step-2 = "steps.step_2_epitopes:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["steps"]
